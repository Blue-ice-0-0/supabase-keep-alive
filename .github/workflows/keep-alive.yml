
name: Keep Supabase active

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS --retry 2 --retry-delay 5 \
            "https://uejodmpjpnpdyvgxunmd.supabase.co/rest/v1/prices?select=valid_from&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
